<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout · Northstar Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">Northstar</a>
      <div class="topbar-actions">
        <a class="btn btn-secondary" href="index.html">Back to shop</a>
        <a class="btn btn-secondary" href="admin.html">Admin</a>
      </div>
    </header>

    <main class="checkout-page">
      <section class="checkout-card">
        <p class="eyebrow">Secure checkout</p>
        <h1>Complete your order</h1>
        <form class="checkout-form" id="checkoutForm">
          <div class="field-row">
            <label>
              Full name
              <input type="text" name="name" required />
            </label>
            <label>
              Email
              <input type="email" name="email" />
            </label>
            <label>
              Phone number
              <input type="number" name="phone" required />
            </label>
          </div>
          <label>
            Address
            <input type="text" name="address" required />
          </label>
          <div class="field-row">
            <label>
              City
              <input type="text" name="city" required />
            </label>
            <label>
              ZIP code
              <input type="number" name="zip" required />
            </label>
          </div>
          <label>Payment method</label>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="payment" value="qr" checked />
              <span>QR Code Payment</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment" value="cod" />
              <span>Cash on Delivery</span>
            </label>
          </div>
          <div class="qr-box" id="qrBox" role="img" aria-label="QR code payment">
            <svg class="qr-code" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <rect width="200" height="200" fill="#ffffff" rx="16" />
              <rect x="20" y="20" width="60" height="60" fill="#1f5b4d" />
              <rect x="32" y="32" width="36" height="36" fill="#ffffff" />
              <rect x="120" y="20" width="60" height="60" fill="#1f5b4d" />
              <rect x="132" y="32" width="36" height="36" fill="#ffffff" />
              <rect x="20" y="120" width="60" height="60" fill="#1f5b4d" />
              <rect x="32" y="132" width="36" height="36" fill="#ffffff" />
              <rect x="96" y="96" width="16" height="16" fill="#1f5b4d" />
              <rect x="120" y="96" width="16" height="16" fill="#1f5b4d" />
              <rect x="144" y="96" width="16" height="16" fill="#1f5b4d" />
              <rect x="96" y="120" width="16" height="16" fill="#1f5b4d" />
              <rect x="144" y="120" width="16" height="16" fill="#1f5b4d" />
              <rect x="96" y="144" width="16" height="16" fill="#1f5b4d" />
              <rect x="120" y="144" width="16" height="16" fill="#1f5b4d" />
              <rect x="144" y="144" width="16" height="16" fill="#1f5b4d" />
              <rect x="80" y="80" width="8" height="8" fill="#1f5b4d" />
              <rect x="88" y="80" width="8" height="8" fill="#1f5b4d" />
              <rect x="80" y="88" width="8" height="8" fill="#1f5b4d" />
              <rect x="88" y="88" width="8" height="8" fill="#1f5b4d" />
            </svg>
            <p>Scan this QR code to pay securely. Powered by QR PH.</p>
          </div>
          <label>
            Delivery notes
            <textarea name="notes" rows="3"></textarea>
          </label>
          <button class="btn btn-primary" id="placeOrderButton" type="submit">Place order</button>
        </form>
        <div class="checkout-message" id="checkoutMessage"></div>
      </section>

      <aside class="summary-card">
        <p class="eyebrow">Order summary</p>
        
        <div id="checkoutSummary"></div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
